
name: Build Směny PRO APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: unzip -o smeny_pro_mobile_build.zip

      - name: Apply mobile-first interface
        run: python apply-mobile-ui.py

      - name: Apply app fixes and appearance settings
        run: python apply-app-enhancements.py

      - name: Fix employee and position forms
        run: python apply-form-fixes.py

      - name: Move save buttons beside close buttons
        run: python apply-modal-actions.py

      - name: Add smarter planning and schedule validation
        run: python apply-pro-phase1.py

      - name: Add shift exchange requests and approval
        run: python apply-pro-phase2.py

      - name: Add monthly workload and absence reports
        run: python apply-pro-phase3.py

      - name: Add formatted Excel export
        run: python apply-pro-phase4.py

      - name: Install dependencies
        working-directory: smeny_pro_mobile_build
        run: npm install xlsx-js-style esbuild

      - name: Bundle Excel writer for offline use
        working-directory: smeny_pro_mobile_build
        run: cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/xlsx.bundle.js

      - name: Create Android project
        working-directory: smeny_pro_mobile_build
        run: npx cap add android

      - name: Add Android Save As export support
        run: python apply-pro-phase5.py

      - name: Install icon rendering dependency
        run: python -m pip install cairosvg

      - name: Apply flexible roles, modern UI and app icon
        run: python apply-pro-phase6.py

      - name: Build native export bridge
        working-directory: smeny_pro_mobile_build
        run: npx esbuild export-bridge.js --bundle --platform=browser --format=iife --outfile=www/export-bridge.bundle.js

      - name: Sync web app
        working-directory: smeny_pro_mobile_build
        run: npx cap sync android

      - name: Build debug APK
        working-directory: smeny_pro_mobile_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smeny-pro-debug-apk
          path: smeny_pro_mobile_build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload patched mobile web source
        uses: actions/upload-artifact@v4
        with:
          name: smeny-pro-mobile-web-source
          path: smeny_pro_mobile_build/www/
          if-no-files-found: error
          retention-days: 14

      - name: Upload original source project
        uses: actions/upload-artifact@v4
        with:
          name: smeny-pro-source-project
          path: smeny_pro_mobile_build.zip
          if-no-files-found: error
          retention-days: 14
