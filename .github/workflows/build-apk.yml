name: Build Směny PRO APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: unzip -o smeny_pro_mobile_build.zip

      - name: Apply mobile-first interface
        run: python apply-mobile-ui.py

      - name: Apply app fixes and appearance settings
        run: python apply-app-enhancements.py

      - name: Fix employee and position forms
        run: python apply-form-fixes.py

      - name: Move save buttons beside close buttons
        run: python apply-modal-actions.py

      - name: Add smarter planning and schedule validation
        run: python apply-pro-phase1.py

      - name: Add shift exchange requests and approval
        run: python apply-pro-phase2.py

      - name: Add monthly workload and absence reports
        run: python apply-pro-phase3.py

      - name: Add formatted Excel export
        run: python apply-pro-phase4.py

      - name: Install dependencies
        working-directory: smeny_pro_mobile_build
        run: npm install xlsx-js-style esbuild

      - name: Bundle Excel writer for offline use
        working-directory: smeny_pro_mobile_build
        run: cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/xlsx.bundle.js

      - name: Create Android project
        working-directory: smeny_pro_mobile_build
        run: npx cap add android

      - name: Install icon rendering dependency
        run: python -m pip install cairosvg

      - name: Apply ROSTERA app name and launcher branding
        run: python apply-rostera-branding.py

      - name: Configure app version (temporary debug signing)
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("smeny_pro_mobile_build/android/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          s, code_count = re.subn(r'(?m)^(\s*versionCode\s+)\d+', r'\g<1>2', s, count=1)
          s, name_count = re.subn(r'(?m)^(\s*versionName\s+)[\'"][^\'"]+[\'"]', r'\g<1>"1.1.0"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          p.write_text(s, encoding="utf-8")
          print("App version set to 1.1.0 (versionCode 2). Gradle will use its generated debug key.")
          PY

      - name: Add Android Save As export support
        run: python apply-pro-phase5.py

      - name: Apply flexible roles, modern UI and app icon
        run: python apply-pro-phase6.py

      - name: Repair employee and shift editors
        run: python apply-pro-phase6-fix.py

      - name: Apply constraint-first shift planner
        run: python apply-pro-phase7.py

      - name: Add per-position shift types and working hours
        run: python apply-pro-phase8.py

      - name: Add safe legacy data migration and render recovery
        run: python apply-runtime-safety.py

      - name: Protect data-changing operations
        run: python apply-data-safety.py

      - name: Upgrade planner with staged constraint solver
        run: python apply-pro-phase9.py

      - name: Apply verified modal action and import/export confirmation fix
        run: python apply-modal-actions-v2.py

      - name: Run full regression suite (pass 1 of 2)
        run: |
          python test-planner-regressions.py
          node test-planner-runtime.js
          python test-modal-actions.py
          node test-modal-actions-runtime.js

      - name: Run full regression suite (pass 2 of 2)
        run: |
          python test-planner-regressions.py
          node test-planner-runtime.js
          python test-modal-actions.py
          node test-modal-actions-runtime.js

      - name: Refresh compact mobile calendar
        run: python apply-calendar-ui.py

      - name: Apply complete ROSTERA settings center
        run: python apply-rostera-settings.py

      - name: Verify all ROSTERA settings sections
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("smeny_pro_mobile_build/www/index.html").read_text(encoding="utf-8")
          required = [
              'data-page="settings"', 'function settingsPage()',
              '1. Pracoviště a firma', '2. Výchozí směny',
              '3. Pravidla plánování', '4. Zaměstnanci a role',
              '5. Personální obsazení', '6. Upozornění v aplikaci',
              '7. Absence a svátky', '8. Zálohování a data',
              '9. Vzhled', '10. Systém a zabezpečení',
              'function restoreBackup()', 'function setPin()',
              'function saveAbs()'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("ROSTERA settings verification failed: " + ", ".join(missing))
          print("Verified all 10 ROSTERA settings areas and core handlers.")
          PY

      - name: Build native export bridge
        working-directory: smeny_pro_mobile_build
        run: npx esbuild export-bridge.js --bundle --platform=browser --format=iife --outfile=www/export-bridge.bundle.js

      - name: Sync web app
        working-directory: smeny_pro_mobile_build
        run: npx cap sync android

      - name: Validate generated JavaScript
        working-directory: smeny_pro_mobile_build
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("www/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
          inline = [x for x in scripts if x.strip()]
          if not inline:
              raise SystemExit("No inline application JavaScript found")
          Path("/tmp/smenypro-inline.js").write_text("\\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/smenypro-inline.js

      - name: Build debug APK
        working-directory: smeny_pro_mobile_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK signature and metadata
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          APK="smeny_pro_mobile_build/android/app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smeny-pro-debug-apk
          path: smeny_pro_mobile_build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload patched mobile web source
        uses: actions/upload-artifact@v4
        with:
          name: smeny-pro-mobile-web-source
          path: smeny_pro_mobile_build/www/
          if-no-files-found: error
          retention-days: 14

      - name: Upload original source project
        uses: actions/upload-artifact@v4
        with:
          name: smeny-pro-source-project
          path: smeny_pro_mobile_build.zip
          if-no-files-found: error
          retention-days: 14
